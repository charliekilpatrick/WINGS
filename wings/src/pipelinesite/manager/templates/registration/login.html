{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<title>Sign in — {{ program_short }}</title>
<link rel="stylesheet" href="{% static 'manager/campaign.css' %}">
{% endblock %}

{% block body %}
<div class="campaign-wrap login-wrap">
  <h1>Sign in</h1>
  <p class="campaign-sub">An account is required to view NGP campaign pages.</p>
  <div class="card">
    {% if form.errors %}
    <p class="alert-plain">That username or password is not correct.</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label>
        Username
        <input class="form-control" type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label>
        Password
        <input class="form-control" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-accent">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
