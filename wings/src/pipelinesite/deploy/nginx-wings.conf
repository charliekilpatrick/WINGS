# WINGS pipelinesite — copy to /etc/nginx/sites-available/wings
# Certbot will add the 443 server block when ACME succeeds.

upstream wings_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name burbidge.northwestern.edu burbidge 165.124.148.146;

    client_max_body_size 64m;

    location /static/ {
        alias /data/ckilpatrick/WINGS/wings/src/pipelinesite/root/;
        expires 7d;
        access_log off;
    }

    # Mosaic preview WebP/AVIF/JPEG published under root/mosaic-previews/.
    # Long cache: artifacts are rewritten in place when mosaics change.
    location /static/mosaic-previews/ {
        alias /data/ckilpatrick/WINGS/wings/src/pipelinesite/root/mosaic-previews/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://wings_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
