{% load static %}

<!DOCTYPE html>
<meta charset="UTF-8">

<html>

<head>
<!--  Boostrap core CSS -->

  <link href="{% static 'css/bootstrap.min.css'%}" rel="stylesheet">
  <link href="{% static 'css/bootstrap.css'%}" rel="stylesheet">
  <script src="{% static 'js/jquery.min.js'%}"></script>
  <script src="{% static 'js/bootstrap.bundle.min.js'%}"></script>
  <style>
    .nav-search { margin-left: auto; }
    .nav-search .form-control { min-width: 12rem; }
  </style>
  {% block extra_head %}{% endblock %}
</head>

<div class="container-fluid">
<nav class="navbar navbar-expand-md navbar-dark " style="background-color: #2f5d8c">
  <a class="navbar-brand" href="{% url 'home_page' %}" title="{{ program_name }}">{{ program_short }}</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
    <div class="navbar-nav">
      <a class="nav-item nav-link" href="{% url 'home_page' %}">Campaign</a>
      <a class="nav-item nav-link" href="{% url 'manager:pipeline_list' %}">Pipelines</a>
      <a class="nav-item nav-link" href="{% url 'manager:jobs' %}">Jobs</a>
      <a class="nav-item nav-link" href="{% url 'manager:tasks' %}">Tasks</a>
      <a class="nav-item nav-link" href="{% url 'manager:events' %}">Events</a>
    </div>
    <form class="form-inline ml-auto nav-search" action="{% url 'manager:target_search' %}" method="get">
      <input class="form-control form-control-sm" type="search" name="q" placeholder="Search targets" aria-label="Search targets" value="{{ search_query|default:'' }}">
    </form>
  </div>
</nav>



  {% block head %}

  {% endblock %}

</div>


{% block body %}
<!--Pages that extend 'base.html' will override this section-->
{% endblock %}

</html>

{%block script%}
<!--Pages that extend 'base.html' will override this section-->
{% endblock %}
