# Install the package and run tests on every push and on PRs into main.
name: WINGS

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIPELINESITE_DEMO: '1'
      WPIPE_ENGINEURL: mysql+pymysql://root:password@127.0.0.1:8000/server
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/wings/src:${{ github.workspace }}/wings/src/pipelinesite

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: server
        ports:
          - 8000:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            default-libmysqlclient-dev

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,docs,demo]" 'sqlalchemy>=1.4,<2' pymysql
          mkdir -p ./temp

      - name: Wait for MySQL
        run: |
          python - <<'PY'
          import time
          import pymysql
          last_error = None
          for _ in range(30):
              try:
                  pymysql.connect(
                      host='127.0.0.1',
                      port=8000,
                      user='root',
                      password='password',
                      database='server',
                  ).close()
                  print('MySQL is ready')
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f'MySQL did not become ready: {last_error}')
          PY

      - name: Create campaign paths used by tests
        run: |
          sudo mkdir -p \
            /data/ckilpatrick/HST/2026dix/.pipelinesite \
            /data/ckilpatrick/HST/ngc1494 \
            /data/ckilpatrick/HST/ngc784 \
            /data/ckilpatrick/HST/.pipelinesite \
            /data/ckilpatrick/st123 \
            /data/ckilpatrick/catalogs/GLADE+
          sudo chown -R "$USER:$USER" /data/ckilpatrick

      - name: Run unit tests
        run: |
          python wings/src/pipelinesite/manage.py test \
            tests.pipelinesite.campaign.test_dispatch \
            tests.pipelinesite.campaign.test_program_sync \
            tests.pipelinesite.catalog \
            tests.pipelinesite.photometry \
            tests.pipelinesite.overlay \
            tests.pipelinesite.inventory.test_stages

      - name: Attempt to run wingspipe
        run: |
          cd ./temp
          wingspipe --github-test

      - name: Build documentation
        run: make html
        working-directory: docs
